[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-market-monitor"
version = "0.2.0"
description = "US stock market alert service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.32.3,<3", "feedparser>=6.0.11,<7", "PyYAML>=6.0.2,<7", "python-dotenv>=1.0.1,<2", "filelock>=3.16,<4", "beautifulsoup4>=4.12,<5", "tzdata>=2024.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[project.scripts]
us-market-monitor = "us_market_monitor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.setuptools.packages.find]
where = ["src"]
