# Broader trial coverage: retain event evidence, relax watchlist and size gates.
rules_version: '2026-10-19.3'
industry_outlook:
  enabled: true
  metrics:
    growth: '\b(?:profit|earnings|revenue|sales)\b.{0,25}\b(?:growth|momentum)\b|(?:이익|순익|매출|실적).{0,15}(?:성장|증가율|증가세)'
    margins: '\b(?:(?:gross|operating|profit) margins?|profitability)\b|영업이익률|매출총이익률|수익성|마진'
    pricing: '\b(?:DRAM|NAND|memory|chip|oil|gas|freight|commodity|contract)\b.{0,35}\b(?:prices?|pricing)\b|(?:메모리|반도체|원유|운임|계약).{0,15}가격'
    demand_supply: '\b(?:demand|orders?|inventories|inventory|oversupply|overcapacity|supply glut)\b|수요|수주|재고|공급과잉|공급 과잉'
  changes:
    - '\b(?:slows?|slowed|slowing|decelerat\w*|weakens?|weakened|weakening|shrinks?|shrank|shrinking|compress\w*|declin\w*|drops?|dropped|falls?|falling|fell|surges?|surged|jumps?|jumped|accelerat\w*|strengthen\w*|rises?|rising|rose|grows?|grew|growing|rebounds?|rebounded|improv\w*|increas\w*|decreas\w*|collaps\w*|halv\w*|doubl\w*)\b'
    - '둔화|급감|급증|압박|축소|악화|개선|상승|하락|감소|증가|확대|과잉'
  material_signals:
    - '\d[\d,.]*(?:\s*[-–]\s*\d[\d,.]*)?\s*%|[$€£]\s*\d[\d,.]*'
    - '\b(?:sharply|steeply|significantly|record|collaps\w*|halv\w*|doubl\w*)\b|급감|급증|사상 최대|사상 최저|반토막'
untracked_event_types:
  - cybersecurity_incident
  - legal_regulatory
  - financial_distress
  - core_product
  - acquisition
  - contract_investment
  - production_disruption
  - business_development
official_alert_scope: all
lifestyle_headlines:
  - '\b(halloween|costume|fashion|beauty|holiday gift).{0,100}\b(trends?|ideas?|inspiration|collection|guide|discover|explore)\b'
  - '\b(trends?|ideas?|inspiration|discover|explore|check out).{0,100}\b(halloween|costumes?|fashion|beauty)\b'
  - '\b(collection|designer|artist|photographer|filmmaker).{0,120}\b(with|using|on|powered by)\s+(?:the\s+)?(?:new\s+)?(iPad|iPhone|Mac|Pixel)\b'
  - '\b(customer stor(?:y|ies)|creator spotlight|behind the scenes|tips and tricks|how to use)\b'
  - '(할로윈|핼러윈|패션|뷰티).{0,60}(트렌드|유행|아이디어|컬렉션|추천|가이드)'
  - '(컬렉션|디자이너|사진작가|아티스트).{0,80}(아이패드|아이폰|맥북|픽셀).{0,30}(함께|활용|사용)'
historical_headlines:
  - '\b(last year|last month|a year ago|previously announced|retrospective)\b|과거 발표|기존 발표 재조명'
commentary_url_pattern: '/(?:video|videos|podcast|podcasts)/'
commentary_patterns:
  - '\b(hosts?|anchors?|panelists?).{0,100}(discuss|dissect|break down|weigh in)'
  - '\b(market recap|earnings recap|weekly recap|daily recap|what it means for investors)\b'
review_retention_days: 7
review_max_rows: 500
score_weights:
  current_action: 2
  relevant_actor: 1
  material_technology: 1
  attributed_announcement: 1
  official_source: 1
  systemic_urgency: 3
hard_exclusions:
  - '\bis .{0,90}(right to|worth buying|a buy)\b|should investors|매수해야 할까'
  - 'price target|target price|analyst rating|upgrades? to buy|downgrades? to|stock picks|stocks? to buy|sponsored|advertorial|worth buying|buy (on )?the dip'
hard_speculation:
  - '\b(in discussions?|discussing an acquisition|seeks to acquire)\b'
  - '\b(rumou?rs?|reportedly|unconfirmed|in talks|in negotiations|negotiating|might|could|may|expected to|would)\b|루머|미확인|추측|협상 중'
industry_topics:
  semiconductor: '\b(DRAM|DDR[45]|LPDDR[56]X?|HBM[234]E?|RDIMM|NAND|memory.cell|memory chip|memory architecture|memory density|chip design|chip structure|chip architecture|AI accelerator|GPU|semiconductor process|[2346]F[²2])\b|반도체|디램|메모리.{0,8}(구조|밀도)|양산'
industry_rules:
  - type: semiconductor_technology
    label: 반도체 기술 진전 발표
    stage: technical_progress
    patterns:
      - '\b(announces?|announced|reports?|reported|unveils?|unveiled|discloses?|disclosed).{0,55}(progress|breakthrough|advance|denser|higher.density|new.{0,15}(architecture|design|structure))'
      - '(기술|구조|공정).{0,20}(진전|돌파|개발 성공).{0,20}(발표|공개)'
  - type: semiconductor_technology
    label: 반도체 출시 계획 발표
    stage: announced_plan
    patterns:
      - '\b(announces?|announced|unveils?|unveiled|confirms?|confirmed|discloses?|disclosed).{0,30}(plans? to|plans? for|launch schedule|roadmap)'
      - '\b(says|said|states|stated).{0,35}(plans? to|will launch|will introduce|will release)'
      - '(출시|양산).{0,15}(계획|일정).{0,20}(발표|공개|확정)'
  - type: semiconductor_technology
    label: 반도체 제품 출시
    stage: launched
    patterns:
      - '\b(launches|launched|introduces|introduced|ships|shipped|begins shipping).{0,65}(new|next.generation|DDR5|HBM|DRAM|memory|GPU|AI accelerator)'
      - '(신규|차세대).{0,20}(반도체|메모리|디램).{0,20}(출시|출하)'
  - type: semiconductor_technology
    label: 반도체 양산 시작
    stage: mass_production
    patterns:
      - '\b(begins?|began|starts?|started|commences?|commenced|announces?|announced).{0,40}mass production'
      - '(반도체|디램|메모리).{0,25}양산.{0,10}(시작|개시|발표)'
high_threshold: 2
critical_threshold: 7
dedup_window_hours: 36
dedup_similarity: 0.62
minimum_deal_usd: 500000000
material_scale_patterns:
  - '\b(major|landmark|strategic|giant|mega|transformative)\b|대규모|핵심 사업'
exclusions:
  - 'price target|target price|analyst rating|upgrades? to buy|downgrades? to|stock picks|stocks? to buy|sponsored|advertorial'
  - 'why .{0,60}(stock|shares)|shares? (rise|fall|gain|drop)|stock market (today|live)|stock movers|market movers|market wrap|weekly recap'
  - '목표주가|추천주|주가가 오른 이유|협찬|광고성'
  - '\b(last year|last month|a year ago|previously announced|retrospective)\b|과거 발표|기존 발표 재조명'
speculation:
  - '\b(in discussions?|discussing an acquisition|seeks to acquire)\b'
  - '\b(could|may|might|rumou?r|reportedly|weighs|considers|considering|expected to|in talks|in negotiations|negotiating|preview|opinion|analysis|what to expect|would)\b'
  - '검토 중|가능할까|전망한다|예상된다|루머|추측'
critical_patterns:
  - 'emergency|unscheduled|unexpected|surprise|slashed|withdraws.{0,30}(guidance|outlook)|긴급|예상 밖'
material_update_patterns:
  - 'revises|revised|raises|cuts|withdraws|finalizes|finalised|finalized|expands|expanded|doubles|amends|amended|정정|수정|확정|확대'
rules:
  - type: monetary_policy
    label: 통화정책 발표
    entity: federal_reserve
    scope: policy
    patterns:
      - '(federal reserve|fomc|fed|연준).{0,90}(issues.{0,15}statement|raises.{0,25}rates|cuts.{0,25}rates|holds.{0,25}rates|announces.{0,30}(policy|liquidity|facility)|금리.{0,12}(결정|인하|인상))'
      - '\bFOMC\b.{0,80}(statement|implementation note|projection materials|economic projections)'
  - type: export_restriction
    label: 수출규제 발표
    entity: export_controls
    scope: policy
    patterns:
      - '(announces|imposes|enacts|expands|finalizes|발표|확정|시행|확대).{0,80}(export (controls?|restrictions?|ban)|수출.{0,12}(규제|제한))'
      - '(export (controls?|restrictions?|ban)|수출.{0,12}(규제|제한)).{0,60}(announced|imposed|expanded|finalized|발표|확정|시행)'
  - type: tariff_policy
    label: 관세·무역 정책 발표
    entity: trade_policy
    scope: policy
    patterns:
      - '(announces|imposes|enacts|signs|raises|cuts|발표|확정|시행).{0,80}(tariffs?|trade restrictions?|관세)'
  - type: emergency_policy
    label: 금융시장 긴급 조치
    entity: financial_stability
    scope: policy
    patterns:
      - '(announces|activates|approves|launches).{0,80}(emergency (lending|liquidity|bailout)|bank rescue|financial stability facility)'
  - type: fiscal_policy
    label: 재정·산업 정책 발표
    entity: fiscal_policy
    scope: policy
    patterns:
      - '(government|congress|president|treasury).{0,70}(signs|enacts|approves).{0,70}(billion|trillion).{0,50}(stimulus|industrial|funding|spending)'
  - type: geopolitical
    label: 지정학·에너지 공급 사건
    entity: global_supply
    scope: global
    patterns:
      - '(closes|blocks|shuts|halts).{0,50}(strait of hormuz|suez canal|oil exports|gas exports)'
      - '(opec|oil producer).{0,60}(announces|agrees).{0,40}(production cut|output cut)'
  - type: earnings_guidance
    label: 실적 전망 변경
    scope: company
    patterns:
      - '(raises|cuts|slashes|withdraws|revises|updates|lowers|boosts).{0,40}(guidance|earnings outlook|revenue outlook|profit forecast|annual forecast)'
      - '(실적|매출|이익).{0,20}전망.{0,12}(상향|하향|철회|수정)'
  - type: earnings
    label: 실적 발표
    scope: company
    patterns:
      - '(reports|announces|releases|posts).{0,60}(quarterly (results|earnings|revenue)|financial results|record (revenue|profit)|earnings beat|earnings miss)'
      - '(reports|announces|releases|posts).{0,50}(first|second|third|fourth|Q[1-4]).{0,35}(quarter|results|earnings|EPS|revenue)'
      - '실적.{0,15}(발표|예상 상회|예상 하회)'
  - type: acquisition
    label: 인수합병 발표
    scope: company
    patterns:
      - '(agrees to acquire|will acquire|acquires|to acquire|completes acquisition|signs.{0,25}merger|merger agreement)'
      - '인수.{0,12}(합의|계약|완료)|합병.{0,12}(확정|계약)'
  - type: contract_investment
    label: 대규모 계약·투자 발표
    scope: company
    patterns:
      - '(signs|wins|secures|announces|invests|commits).{0,100}(billion|trillion|multi-billion).{0,60}(contract|deal|investment|factory|plant|data cent(er|re))'
      - '(signs|wins|secures).{0,40}(contract|deal).{0,40}(billion|trillion)'
      - '\b(signs|wins|secures|announces|invests|commits)\b.{0,100}\b(?:million|billion|trillion)\b.{0,60}\b(contract|deal|investment|factory|plant|data cent(?:er|re))\b'
      - '\b(signs|wins|secures)\b.{0,40}\b(contract|deal)\b.{0,40}\b(?:million|billion|trillion)\b'
  - type: production_disruption
    label: 생산·공급 차질
    scope: company
    patterns:
      - '(halts|suspends|shuts down|stops|cuts).{0,55}(production|manufacturing|major factory|chip supply)'
      - '생산.{0,12}(중단|대규모 감산)|공급망.{0,10}마비'
  - type: legal_regulatory
    label: 중대 법적·규제 조치
    scope: company
    patterns:
      - '(court|regulator|justice department|ftc|fda|government).{0,60}(blocks|bans|revokes|orders.{0,25}halt|imposes.{0,25}billion)'
  - type: core_product
    label: 핵심 기술·제품 발표
    scope: company
    patterns:
      - '(unveils|launches|announces).{0,60}(next-generation|breakthrough).{0,40}(gpu|semiconductor|chip architecture|ai accelerator)'
      - '\b(introduces|unveils|launches|releases|announces).{0,35}\b(?:the |a )?new\b.{0,60}\b(iPhone|iPad|MacBook|Pixel|GPU|AI accelerator|CUDA-X|cuPotential|AI model|AI platform)\b'
      - '\b(?:introduces|unveils|launches|releases|announces|introduced|unveiled|launched|released|announced)\b.{0,70}\b(?:new|next.generation)\b.{0,60}\b(?:AI model|cloud platform|security platform|AI chip|electric vehicle|robot|battery|drug|vaccine)\b'


  - type: core_product
    label: 자동차·자율주행 핵심 제품 공개
    scope: company
    evidence_actor_required: true
    patterns:
      - '\b(?:unveils?|unveiled|launches|launched|introduces|introduced|reveals?|revealed)\b.{0,100}\b(?:Roadster|Cybercab|Cybertruck|Robotaxi|Optimus|Full Self.Driving|FSD)\b'
  - type: cybersecurity_incident
    label: 보안 침해·정보 유출
    scope: company
    evidence_actor_required: true
    patterns:
      - '\b(?:confirms?|confirmed|discloses?|disclosed|reports?|reported|suffers?|suffered)\b.{0,100}\b(?:data breach|security breach|cyberattack|ransomware|data theft|unauthorized access)\b'
      - '\b(?:hackers?|attackers?)\b.{0,60}\b(?:steal|stole|stolen|breach|breached|leak|leaked)\b.{0,90}\b(?:data|systems?|credentials?|records?)\b'
  - type: legal_regulatory
    label: 안전 조사·리콜·규제 조치
    scope: company
    evidence_actor_required: true
    patterns:
      - '\b(?:NHTSA|FTC|DOJ|regulators?|authorities|Justice Department)\b.{0,60}\b(?:opens?|opened|launches|launched|begins?|began|expands?|expanded)\b.{0,50}\b(?:probe|investigation)\b'
      - '\b(?:recalls?|recalled)\b.{0,45}\b[\d,]+\s+(?:vehicles?|cars?|trucks?|products?)\b'
  - type: financial_distress
    label: 채무 불이행·신용등급 하향
    scope: company
    evidence_actor_required: true
    patterns:
      - '\b(?:defaults?|defaulted)\s+on\b.{0,50}\b(?:debt|bonds?|loans?|payment)\b'
      - '\b(?:files?|filed)\s+for\s+(?:bankruptcy|Chapter 11)\b'
      - '\b(?:Moody.s|S&P|Fitch)\b.{0,80}\b(?:downgrades?|downgraded|cuts?|cut)\b.{0,80}\b(?:credit|rating)\b'
      - '\b(?:bond yields?|borrowing costs?|credit default swaps?|default risk)\b.{0,60}\b(?:surges?|surged|jumps?|jumped|soars?|soared|record high)\b'
  - type: business_development
    label: 사업 확장·주요 제휴 발표
    scope: company
    evidence_actor_required: true
    patterns:
      - '\b(?:announces|announced|signs|signed|expands|expanded)\b.{0,70}\b(?:strategic partnership|multiyear partnership|multi.year partnership|licensing agreement|commercial agreement)\b'
      - '\b(?:opens|opened|launches|launched|expands|expanded)\b.{0,70}\b(?:data cent(?:er|re)|manufacturing facility|battery factory|chip factory)\b'
